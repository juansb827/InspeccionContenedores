apply plugin: 'com.android.application'

android {
    compileSdk 34

    lint {
        //checkReleaseBuilds false
        abortOnError false
    }
    
    defaultConfig {
        applicationId "com.juans.inspeccion"
        minSdk 22
        targetSdk 33
        versionCode 9
        versionName "1.9"
        signingConfig signingConfigs.debug
    }
    
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
    namespace 'com.juans.inspeccion'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation files('libs/iText-5.0.5.jar')
    implementation files('libs/jtds-1.2.7.jar')
    implementation files('libs/jxl.jar')
    implementation files('libs/poi-3.10.1-20140818.jar')
    implementation files('libs/EZioAD.jar')
    implementation files('libs/commons-net-3.3.jar')
    implementation files('libs/commons-io-2.4.jar')
    implementation 'com.newrelic.agent.android:android-agent:5.+'
    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'
    //implementation 'pub.devrel:easypermissions:2.0.1'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

