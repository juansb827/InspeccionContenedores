apply plugin: 'com.android.application'
apply from: 'legacy-robolectric.gradle'

android {
    compileSdk 34

    lint {
        abortOnError true
        baseline file("lint-baseline.xml")
    }
    
    defaultConfig {
        applicationId "com.juans.inspeccion"
        minSdk 29
        targetSdk 33
        versionCode 10
        versionName "1.10"
        testInstrumentationRunner 'com.juans.inspeccion.Interfaz.Gallery.GalleryInstrumentation'
    }
    
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // Production signing uses the existing deployed key outside this migration.
            signingConfig null
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
    namespace 'com.juans.inspeccion'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation files('libs/iText-5.0.5.jar')
    implementation files('libs/jtds-1.2.7.jar')
    implementation files('libs/jxl.jar')
    implementation files('libs/poi-3.10.1-20140818.jar')
    implementation files('libs/EZioAD.jar')
    implementation files('libs/commons-net-3.3.jar')
    implementation files('libs/commons-io-2.4.jar')
    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
